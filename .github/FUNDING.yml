# Puts a "Sponsor" button on the repository.
#
# This only does anything once the account has been approved for GitHub
# Sponsors at https://github.com/sponsors — that step needs bank details, tax
# forms and identity verification, so it has to be done by hand. The file is
# committed ahead of time so the button appears the moment approval lands,
# rather than needing a second commit nobody remembers to make.
github: [criso2hd-alt]
# Buy Me a Coffee needs no approval, so this half of the Sponsor button works
# immediately — the same link as the README badge and the in-app banner.
buy_me_a_coffee: criso2hdj
