[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlss5-converter"
version = "0.1.0"
description = "Run NVIDIA's DLSS 5 neural renderer over still images."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10.4,<12",
  "torch>=2.4,<3",
  "transformers>=4.56,<5",
  "safetensors>=0.4,<1",
  "huggingface-hub>=0.25,<1",
  "truststore>=0.9,<1",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]
test = ["pytest>=8,<9"]

[project.scripts]
dlss5-converter = "dlss5_converter.app:main"

[tool.setuptools.packages.find]
include = ["dlss5_converter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
