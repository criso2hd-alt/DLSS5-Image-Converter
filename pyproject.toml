[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlss5-converter"
version = "0.4.5"
description = "Run NVIDIA's DLSS 5 neural renderer over still images."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10.4,<12",
  # BigTIFF streaming output for Ultra Detail: a 600 MP 16-bit result exceeds
  # regular TIFF's 4 GB limit and cannot be held in RAM to encode, so it is
  # written incrementally as BigTIFF. Pure Python + numpy, small, BSD-3.
  "tifffile>=2024.1",
  # Depth runs on ONNX Runtime, not PyTorch - see onnx_depth.py - which is what
  # removes the 2.7 GB torch download. The shipped GPU path is DirectML: it runs
  # on any DirectX 12 GPU (NVIDIA/AMD/Intel) through the driver the user already
  # has, is a single ~18 MB DLL (no CUDA toolkit, no 1.5 GB cuDNN bundle, no
  # download), and matches CUDA's speed on this workload. CPU is the built-in
  # fallback. A user who wants CUDA can pip install onnxruntime-gpu instead;
  # _providers() prefers it when present.
  "onnxruntime-directml>=1.20,<2",
  "huggingface-hub>=0.25,<1",
  "truststore>=0.9,<1",
  "platformdirs>=4,<5",
  # The 3D tab renders a real depth mesh on the GPU (Vulkan/D3D12/Metal) via
  # wgpu. No new model, just a rasteriser; see mesh3d.py.
  "wgpu>=0.32,<0.33",
  # Rewrites the LaMa graph once so it runs on DirectML (see inpaint.py). Pure
  # graph editing, no inference; a few MB.
  "onnx>=1.16",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]
test = ["pytest>=8,<9"]
# Dev-only tooling for scripts/export_onnx.py, which regenerates the bundled
# ONNX depth models from the Depth Anything V2 weights. Never needed at runtime.
export = [
  "torch>=2.4,<3",
  "transformers>=4.56,<5",
  "onnxconverter-common>=1.14",
]

[project.scripts]
dlss5-converter = "dlss5_converter.app:main"

[tool.setuptools.packages.find]
include = ["dlss5_converter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
