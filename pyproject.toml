[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlss5-converter"
version = "0.3.0"
description = "Run NVIDIA's DLSS 5 neural renderer over still images."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10.4,<12",
  # Depth runs on ONNX Runtime's CUDA provider, not PyTorch - see onnx_depth.py.
  # This is what removes the 2.7 GB torch download. The 1.29 line targets the
  # CUDA 13 / cuDNN 9 runtime the release bundles (from torch's cu130 build);
  # keep them in step. CPU is the built-in fallback when no GPU is present.
  "onnxruntime-gpu>=1.29,<2",
  "huggingface-hub>=0.25,<1",
  "truststore>=0.9,<1",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]
test = ["pytest>=8,<9"]
# Dev-only tooling for scripts/export_onnx.py, which regenerates the bundled
# ONNX depth models from the Depth Anything V2 weights. Never needed at runtime.
export = [
  "torch>=2.4,<3",
  "transformers>=4.56,<5",
  "onnx>=1.16",
  "onnxconverter-common>=1.14",
]

[project.scripts]
dlss5-converter = "dlss5_converter.app:main"

[tool.setuptools.packages.find]
include = ["dlss5_converter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
